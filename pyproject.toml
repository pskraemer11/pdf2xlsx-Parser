# Zentrale Projekt- und Toolkonfiguration.

# Hinweis: Bewusst KEIN installierbares Paket (kein [build-system]) –
# das Skript wird direkt mit Python ausgeführt:
#     python pdf2xlsx-Parser.py <pdf-ordner>
# Die Abhängigkeiten werden mit "pip install pdfplumber openpyxl" installiert.

[project]
name = "pdf2xlsx-parser"
version = "1.0.0"
description = "Extrahiert Kontobewegungen aus PDF-Kontoauszügen und speichert sie als Excel-Datei"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "pskraemer11" }]
keywords = ["pdf", "xlsx", "excel", "bank-statement", "kontoauszug", "parser"]
dependencies = [
    "pdfplumber>=0.10",
    "openpyxl>=3.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Projekteigene Regelauswahl in drei Stufen. Ohne diesen Block würde eine
# globale RUFF_CONFIG (select = ["ALL"]) den Prüfumfang dieses Projekts
# verändern und den Pre-Push-Hook unabhängig von der Projektkonfiguration
# scheitern lassen.
select = [
    # Stufe 1 - Korrektheit: Syntax-, Namens- und Importfehler.
    "E4", "E7", "E9", "F",
    # Stufe 2 - Struktur und moderne Python-Nutzung.
    "I", "UP", "SIM", "PTH", "RUF",
    # Stufe 3 - Robustheit und Sicherheit.
    "B", "BLE", "TRY", "S", "DTZ",
]

[tool.ruff.lint.per-file-ignores]
# Tests dürfen assert verwenden; im Anwendungscode bleibt S101 aktiv.
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
